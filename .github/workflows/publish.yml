name: Publish

on:
  push:
    tags:
      - v**

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify release
        run: ./gradlew check

      - name: Publish packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
