name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run Gradle check
        if: runner.os != 'Windows'
        run: ./gradlew check
      - name: Run Gradle check (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat check
