name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          check-latest: true
      - uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run Gradle check
        if: runner.os != 'Windows'
        run: ./gradlew check
      - name: Run Gradle check (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat check

      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7.1.1
        with:
          # Fork pull requests use Codecov's public-repository tokenless upload.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: plugin/build/reports/jacoco/test/jacocoTestReport.xml,rules/build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          disable_file_fixes: true
          fail_ci_if_error: true
