coverage:
  status:
    project:
      default:
        target: 95%
        threshold: 0%
    patch:
      default:
        target: 99%
        threshold: 0%

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 0%
      - type: patch
        target: 99%
        threshold: 0%
  individual_components:
    - component_id: plugin
      name: Plugin
      paths: ["plugin/**"]
    - component_id: rules
      name: Rules
      paths: ["rules/**"]
