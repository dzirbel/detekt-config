# <TEST_PATHS> and <FORBIDDEN_METHOD_CALLS> use the corresponding DetektConfigExtension values.
config:
  validation: true
  checkExhaustiveness: true
  warningsAsErrors: true
  excludes: []

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'IssuesReport'
    - 'FileBasedIssuesReport'
    # - 'LiteIssuesReport'

processors:
  active: false # no need for processors when not generating output reports

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
    licenseTemplateIsRegex: false
    licenseTemplate: ''
  DocumentationOverPrivateFunction:
    active: false
  DocumentationOverPrivateProperty:
    active: false
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: false
    endOfSentenceFormat: '([.?!][ \t\n\r\f<])|([.?!:]$)'
  KDocReferencesNonPublicProperty:
    active: true
  OutdatedDocumentation:
    active: true
    matchTypeParameters: true
    matchDeclarationsOrder: true
    allowParamOnConstructorProperties: false
  UndocumentedPublicClass:
    active: false
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
    searchInProtectedClass: false
  UndocumentedPublicFunction:
    active: false
    searchProtectedFunction: false
  UndocumentedPublicProperty:
    active: false
    searchProtectedProperty: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: false
    allowedComplexity: 15
  ComplexCondition:
    active: true
    allowedConditions: 4
  ComplexInterface:
    active: false
    allowedDefinitions: 10
    includeStaticDeclarations: false
    includePrivateDeclarations: false
    ignoreOverloaded: false
  CyclomaticComplexMethod:
    active: false
    allowedComplexity: 15
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
    nestingFunctions:
      - 'also'
      - 'apply'
      - 'forEach'
      - 'isNotNull'
      - 'ifNull'
      - 'let'
      - 'run'
      - 'use'
      - 'with'
  LabeledExpression:
    active: true
    ignoredLabels: []
  LargeClass:
    active: true
    allowedLines: 600
  LongMethod:
    active: false
    allowedLines: 60
  LongParameterList:
    active: false
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
  MethodOverloading:
    active: false
    allowedOverloads: 6
  NamedArguments:
    active: true
    allowedArguments: 3
    ignoreArgumentsMatchingNames: false
  NestedBlockDepth:
    active: true
    allowedDepth: 6
  NestedScopeFunctions:
    active: true
    allowedDepth: 1
    functions: ['kotlin.apply', 'kotlin.run', 'kotlin.with']
  ReplaceSafeCallChainWithRun:
    active: false
  StringLiteralDuplication:
    active: false
    allowedDuplications: 3
    ignoreAnnotation: true
    allowedWithLengthLessThan: 5
    ignoreStringsRegex: '$^'
  TooManyFunctions:
    excludes: '<TEST_PATHS>'
    active: true
    allowedFunctionsPerFile: 25
    allowedFunctionsPerClass: 25
    allowedFunctionsPerInterface: 25
    allowedFunctionsPerObject: 100
    allowedFunctionsPerEnum: 10
    ignoreDeprecated: false
    ignorePrivate: true
    ignoreOverridden: true
    ignoreAnnotatedFunctions: []

coroutines:
  active: true
  CoroutineLaunchedInTestWithoutRunTest:
    active: true
  GlobalCoroutineUsage:
    active: false
  InjectDispatcher:
    active: false
    dispatcherNames: ['IO', 'Default', 'Unconfined']
  RedundantSuspendModifier:
    active: true
